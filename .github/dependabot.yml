version: 2
updates:
  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
