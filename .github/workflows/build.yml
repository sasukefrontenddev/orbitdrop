name: Native builds

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test file operations
        run: zsh macos/test.sh
      - name: Build universal app
        run: zsh macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitDrop-macOS-universal
          path: macos/build/OrbitDrop.app

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build self-contained app
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitDrop-Windows-x64
          path: windows/build/win-x64/OrbitDrop.exe
